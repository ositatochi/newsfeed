{% extends "base.html" %}
{% block content %}
  {% if not articles %}
    <p class="muted">No new articles. Run the crawler.</p>
  {% else %}
    {% for article in articles %}
      <div class="card">
        <div class="title">{{ article.title }}</div>
        <div class="meta">{{ article.source_name }} · {{ article.published_at or article.fetched_at }}</div>
        <div class="row">
          <a href="{{ url_for('article', article_id=article.id) }}" class="btn primary">Open</a>
          <a href="{{ url_for('mark_status', article_id=article.id, status='rejected') }}" class="btn danger">Reject</a>
        </div>
      </div>
    {% endfor %}
  {% endif %}
{% endblock %}
