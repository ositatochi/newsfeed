<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFeed Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-content">
      <a href="/" class="brand">TechFeed <span class="badge">Studio</span></a>
      <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()" type="button">
        <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
      </button>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeIcon').innerText = theme === 'dark' ? '🌙' : '☀️';
      document.getElementById('themeLabel').innerText = theme === 'dark' ? 'Dark Mode' : 'Light Mode';
      localStorage.setItem('tf_theme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    (function() {
      const savedTheme = localStorage.getItem('tf_theme') || 'dark';
      applyTheme(savedTheme);
    })();
  </script>
</body>
</html>
